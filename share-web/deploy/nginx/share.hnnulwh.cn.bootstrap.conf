# Temporary HTTP-only bootstrap used before TLS files are installed.
# Replace it with share.hnnulwh.cn.conf after the certificate and key exist
# under /etc/nginx/ssl/share.hnnulwh.cn/.

server {
    listen 80;
    listen [::]:80;
    server_name share.hnnulwh.cn;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
