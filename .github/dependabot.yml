# Dependency update automation (https://docs.github.com/en/code-security/dependabot)
# Note: no npm ecosystems here — docs-site/ and editors/vscode use bun, whose
# bun.lock Dependabot cannot maintain (it would leave the lockfile stale and
# fail `bun install --frozen-lockfile`). Use Renovate if JS automation is wanted.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
