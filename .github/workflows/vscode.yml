name: VS Code extension

on:
  pull_request:
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode.yml"
  push:
    branches: [main]
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode.yml"

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd editors/vscode && bun install --frozen-lockfile

      - name: Test
        run: cd editors/vscode && bun run test
