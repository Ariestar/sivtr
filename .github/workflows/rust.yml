name: Rust

# Merge gate. Required on PRs targeting main:
#   ci (ubuntu-latest), ci (windows-latest), MSRV
# Push to main does not re-run this workflow: squash + up-to-date means
# the PR tree is the tree that lands. release-plz handles versioning.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          title = os.environ["PR_TITLE"].strip()
          pat = re.compile(
              r"^(feat|fix|refactor|chore|docs|test|ci|perf|build|revert|style)"
              r"(\([a-z0-9/_-]+\))?(!)?: .+$"
          )
          if not pat.match(title):
              print(
                  "::error::PR title must be a Conventional Commit subject, "
                  f"e.g. 'feat(search): add query'. Got: {title!r}"
              )
              sys.exit(1)
          print(f"ok: {title}")
          PY

  ci:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Binary smoke test
        # Real CLI entry points; catches runtime breakage unit tests miss.
        run: |
          cargo run --quiet -- --version
          cargo run --quiet -- doctor

      - name: Windows ConPTY TUI smoke
        if: runner.os == 'Windows'
        run: cargo test --locked tui::conpty_tests::windows_conpty_tui_smoke -- --ignored --exact

  msrv:
    name: MSRV
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [ -z "$ver" ]; then
            echo "::error::Could not read rust-version from Cargo.toml"
            exit 1
          fi
          echo "toolchain=$ver" >> "$GITHUB_OUTPUT"
          echo "MSRV $ver" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check on MSRV
        run: cargo check --workspace --locked --all-targets
