name: Rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Binary smoke test
        # Real CLI entry points on each OS; catches runtime breakage that
        # unit tests miss (bad hook glue, missing DLL, platform detection).
        run: |
          cargo run --quiet -- --version
          cargo run --quiet -- doctor

      - name: Windows ConPTY TUI smoke
        if: runner.os == 'Windows'
        run: cargo test --locked tui::conpty_tests::windows_conpty_tui_smoke -- --ignored --exact

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo.lock
        # Fails only on known vulnerabilities. Two transitive advisories
        # remain as warnings (paste, spin — upstream deps of ratatui); they
        # do not fail the gate.
        run: cargo audit

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Keep in sync with rust-version in Cargo.toml.
      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check on MSRV
        run: cargo check --workspace --locked --all-targets

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd docs-site && bun install --frozen-lockfile

      - name: Astro check
        run: cd docs-site && bun run check

      - name: Build
        run: cd docs-site && bun run build

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd editors/vscode && bun install --frozen-lockfile

      - name: Test
        run: cd editors/vscode && bun run test
