name: Renovate

on:
  schedule:
    # 每周一 06:00 UTC（北京时间 14:00）自动扫描一次依赖
    - cron: "0 6 * * 1"
  workflow_dispatch: {} # 手动触发：Actions 页面点 "Run workflow"

permissions:
  contents: write # 推送 Renovate 的分支
  pull-requests: write # 创建/更新依赖 PR
  issues: write # dependency dashboard issue

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationFile: renovate.json
